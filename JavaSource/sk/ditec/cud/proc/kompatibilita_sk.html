<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Kontrola kompatibility</title>
    
    <style type="text/css">
        table, td {
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        .list-item {
            padding: 5px 0 0 15px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 22px;
            color: #555555;
        }
    </style>
</head>

<body style="margin: 0; padding: 0;">

    <table align="left" border="0" cellpadding="0" cellspacing="0" width="800" style="border-collapse: collapse; width: 800px;">
        <tr>
            <td align="center" style="padding: 0px 0;">

                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <td style="padding: 0 20px 0px 20px; font-family: Arial, sans-serif; font-size: 13px; color: #333333;">
                            <h3>Zoznam tabuliek s chybami:</h3>
                        </td>
                    </tr>
                    <tr>
                        <td class="list-item" style="padding: 0px 0px 10px 40px; font-size: 13px; font-weight: normal; line-height: 15px; color: #555555;">
                            Počet: {cudErrorCount}
                        </td>
                    </tr>
                </table>
                
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%; border-collapse: collapse;">
                    {cudTablesError}
                </table>
                
                <div style="height: 15px; font-size: 15px; line-height: 15px;">&nbsp;</div>

                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <td style="padding: 0 20px 0px 20px; font-family: Arial, sans-serif; font-size: 13px; color: #333333;">
                            <h3>Zoznam tabuliek bez chýb:</h3>
                        </td>
                    </tr>
                    <tr>
                        <td class="list-item" style="padding: 0px 0px 10px 40px; font-size: 13px; font-weight: normal; line-height: 15px; color: #555555;">
                            Počet: {cudRightCount}
                        </td>
                    </tr>
                </table>
                
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="width: 100%; border-collapse: collapse;">
                    {cudTablesRight}
                </table>

                <div style="height: 15px; font-size: 15px; line-height: 15px;">
                    <br/><br/><hr/>Toto je automaticky generovaný e-mail, na túto správu prosím neodpovedajte.
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
